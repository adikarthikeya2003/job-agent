# job-agent config — single source of truth for company list, keywords, and thresholds.
# Edit this file to add companies, change role targeting, or adjust the surfacing threshold.

resume:
  # Path is relative to job-agent/ unless absolute. Regenerated from base_resume.tex via
  # `python3 cli.py sync-resume` whenever base_resume.tex changes.
  source_md: "resume.md"
  source_tex: "../base_resume.tex"

scoring:
  # "tfidf" = default, zero network cost, deterministic. "embeddings" = local
  # sentence-transformers model (all-MiniLM-L6-v2), stronger semantic match, slower,
  # requires a one-time model download (still free, no API key).
  method: "tfidf"
  embeddings_model: "all-MiniLM-L6-v2"
  # Linear rescaling of raw cosine-similarity*100 so scores land in a usable 0-100 range.
  # Raw TF-IDF cosine similarity between a resume section and a full JD (mostly company
  # boilerplate) rarely exceeds ~0.15 even for a strong match. This constant does NOT
  # change ranking/ordering of jobs against each other -- only the scale. Calibrated once
  # against a real Greenhouse batch (Stripe, 526 postings): raw scores for genuinely
  # on-target ML/AI roles landed 10-14, so boost=3.5 puts a strong match around 35-50.
  # Re-tune if your own score distribution (logged every run) runs persistently off.
  score_boost: 3.5
  # Section weights must sum to 1.0. See match_scorer.py for how each is applied.
  section_weights:
    skills: 0.40
    experience_projects: 0.40
    summary: 0.10
    education: 0.10
  # Jobs scoring below this are still logged but excluded from the surfaced output.
  surface_threshold: 30
  # New-grad bias applied to match_score after the base TF-IDF score (before the 0-100
  # clamp). User is a fresh grad (2026-08-14): "give more preference to new grad roles"
  # and "quality over quantity" — postings that clearly fit a 0-2 yr candidate should
  # rank above wide-band postings that merely clear the years filter. (No separate
  # "near-grad" bonus for min years == 3 — filters.max_experience_years: 3 now drops
  # those entirely, tightened 2026-08-17 to strictly <3 years.)
  new_grad_bonus: 10          # experience_required min years <= 2
  new_grad_label_bonus: 5     # "(new grad)" / "(multi-level)" explicitly in the label
  senior_title_penalty: 8     # title matches filters.exclude_title_terms
  wide_band_penalty: 6        # stated upper bound > max_experience_years
  # September Sprint (2026-08-17): "one primary role, one backup" — data_scientist is
  # locked primary (user: "data science is what I do"), ai_engineer is backup. Boost
  # both above data_engineer/data_analyst/software_engineer, which the resume also
  # matches well on keywords but which the user does NOT want leading the ranking.
  primary_role_bonus: 12      # role_family == primary_role_family
  backup_role_bonus: 6        # role_family == backup_role_family
  primary_role_family: "data_scientist"
  backup_role_family: "ai_engineer"
  # "Apply within 24-48h of posting first" — bonus decays with age so same-day/next-day
  # postings float to the top of an otherwise-tied score, without a hard cutoff that
  # would drop a strong older match entirely.
  fresh_posting_bonus_48h: 8   # posted_date within the last 48 hours
  fresh_posting_bonus_7d: 3    # posted_date within the last 7 days (but not 48h)
  # Hard cap on how many postings get surfaced, applied AFTER scoring/bias/filtering,
  # keeping only the top N by adjusted score. User (2026-08-14): "don't show unnecessary
  # 100 roles ... quality over quantity". None = no cap (old behavior).
  max_surfaced_jobs: 25

roles:
  # Keyword families used to classify + filter postings. A posting matches a family if
  # its title or first ~200 words of description contains any keyword (case-insensitive).
  families:
    data_engineer:
      - "data engineer"
      - "data engineering"
      - "etl engineer"
      - "data platform engineer"
      - "analytics engineer"
    data_analyst:
      - "data analyst"
      - "business analyst"
      - "reporting analyst"
    data_scientist:
      - "data scientist"
      - "data science"
      - "applied scientist"
    ai_engineer:
      - "ai engineer"
      - "applied ai"
      - "genai engineer"
      - "llm engineer"
    ml_engineer:
      - "machine learning engineer"
      - "ml engineer"
      - "mle "
      - "ai/ml engineer"
      - "ai|ml engineer"
    software_engineer:
      - "software engineer"
      - "swe "
      - "software developer"

  # Seniority keywords used to tag postings; "unspecified" is used when none match.
  seniority:
    entry: ["entry level", "new grad", "university grad", "early career", "level i", " i ", "associate"]
    mid: ["level ii", " ii ", "mid level", "2+ years", "3+ years"]
    senior: ["senior", "sr.", "sr ", "staff", "principal", "lead "]

  experience_range:
    min_yoe: 0
    max_yoe: 12

filters:
  # Only surface US-based postings (remote-US counts as US; remote-unspecified/global
  # postings with no US location signal are excluded). Applies to the daily run and
  # on-demand runs alike — flip to false if you ever want to see non-US postings too.
  us_only: true

  # User is a fresh grad. Two tiers, both matched as whole words against the job
  # title (case-insensitive):
  #   hard_exclude_title_terms: unambiguous leadership/IC-senior titles that are never
  #   an early-career fit regardless of what the JD's (often mis-parsed or boilerplate)
  #   experience text says — dropped from surfaced output entirely, not just flagged.
  #   Added 2026-08-17 after Director/Manager-level postings surfaced as "strong
  #   matches" on TF-IDF text similarity alone: "quality not quantity ... I don't want
  #   to waste my time checking unnecessary jobs."
  #   exclude_title_terms: genuinely ambiguous titles (some employers use "Senior" for
  #   a near-entry band) — flagged inline, not hidden, per the 2026-08-14 request.
  hard_exclude_title_terms:
    - "director"
    - "manager"
    - "head of"
    - "vp"
    - "vice president"
    - "principal"
  exclude_title_terms:
    - "architect"
    - "staff"
    - "senior"
    - "sr"
    - "lead"

  # Postings whose parsed minimum years-of-experience is >= this are dropped from
  # surfaced output. Postings with no stated experience ("not stated") are kept —
  # there's no signal to exclude them on, and the detail-enrichment pass (see
  # pipeline.py::_enrich_experience + fetchers/detail.py) re-fetches the full JD for
  # exactly these before this filter runs, so "not stated" reflects a genuinely
  # checked JD, not a skipped one. This is an EXCLUSIVE lower bound: 3 means "keep
  # strictly <3 years" — SUPERSEDES the earlier 2026-08-14 "keep <=3 years" request;
  # corrected 2026-08-17 ("less than 3 years... strictly"). A posting requiring
  # exactly 3 years is now excluded, not kept.
  max_experience_years: 3

sponsorship:
  # Phrases that flag a posting as explicitly excluding visa sponsorship — critical for OPT.
  exclude_phrases:
    - "not sponsor"
    - "no sponsorship"
    - "does not sponsor"
    - "unable to sponsor"
    - "will not sponsor"
    - "must be a us citizen"
    - "u.s. citizenship required"
    - "must be authorized to work in the united states without sponsorship"
  include_phrases:
    - "will sponsor"
    - "sponsorship available"
    - "visa sponsorship provided"

notifications:
  channel: "none"   # "none" | "stdout" | "file"
  file_path: "output/latest_notify.txt"

